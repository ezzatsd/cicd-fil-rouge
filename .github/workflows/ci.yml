name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]        # utile pour le badge (étape 6)
  workflow_dispatch:
    inputs:
      use-cache:
        description: "Activer le cache pip"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.use-cache) && 'pip' || '' }}
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Vérifier le code avec Ruff
        run: ruff check .

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.use-cache) && 'pip' || '' }}
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Exécuter les tests
        run: pytest -q --junitxml=rapport-tests-${{ matrix.python-version }}.xml

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-${{ matrix.python-version }}
          path: rapport-tests-${{ matrix.python-version }}.xml
          retention-days: 7

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Vérifier le résultat des jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Tous les contrôles sont verts"
